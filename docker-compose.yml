# AegisCloud Local Development Stack
# Starts PostgreSQL 16 and Redis 7 for local development.
#
# Credentials match the defaults baked into control-plane DataSourceConfig
# and RedisConfig so that `mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev`
# starts without any environment variable overrides.
#
# Usage:
#   docker compose up -d        # start
#   docker compose down -v      # stop + wipe volumes

services:
  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16
  # URL: postgres://aegiscloud:aegiscloud@localhost:5432/aegiscloud
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegiscloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aegiscloud
      POSTGRES_USER:     aegiscloud
      POSTGRES_PASSWORD: aegiscloud
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegiscloud -d aegiscloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # Redis 7 — caching, locks, coordination
  # No password required for local development
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aegiscloud-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: aegiscloud-network
