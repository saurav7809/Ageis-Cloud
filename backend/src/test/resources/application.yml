spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

aegiscloud:
  security:
    jwt:
      secret: dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItanVuaXQtdGVzdHMtb25seQ==
      expiration-ms: 86400000

  kubernetes:
    in-cluster: false
    context: docker-desktop

logging:
  level:
    root: WARN
    com.aegiscloud: INFO
